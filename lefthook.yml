commit-msg:
  commands:
    validate-message:
      run: bun run validate:commit {1}

pre-commit:
  commands:
    lint:
      run: bun run lint:fix && bun run lint
      stage_fixed: true

pre-push:
  commands:
    lint:
      run: bun run lint
    check:
      run: bun run check
    test:
      run: bun run test
